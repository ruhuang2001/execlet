version: 2

project_name: execlet

before:
  hooks:
    - make agent

builds:
  - id: execletd
    main: ./cmd/execletd
    binary: execletd
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    env: [CGO_ENABLED=0]

  - id: execletctl
    main: ./cmd/execletctl
    binary: execletctl
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    env: [CGO_ENABLED=0]

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md
      - examples/mcp/Dockerfile
      - examples/mcp/README.md
      - examples/mcp/demo/*

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  disable: true
