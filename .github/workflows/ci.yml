name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Exact source revision to validate
        type: string
        default: ''

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  e2b-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      PYTHON: python
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - name: require the installed-package acceptance suite
        id: suite
        env:
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          if test -f scripts/e2b-compatibility/installed.sh; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
            if test -f scripts/e2b-compatibility/background-reference.json && test -f scripts/e2e-operations.py; then
              echo 'background=true' >> "$GITHUB_OUTPUT"
            elif test -n "$REQUESTED_REF" &&
                 git merge-base --is-ancestor HEAD 'refs/tags/v0.0.2^{commit}'; then
              echo 'Validating the historical foreground-only profile.'
            else
              echo 'Missing required background/operations acceptance.' >&2
              exit 1
            fi
          elif test -n "$REQUESTED_REF" &&
               test "$(git rev-parse HEAD)" = "$(git rev-parse --verify 'refs/tags/v0.0.1^{commit}' 2>/dev/null)"; then
            echo 'The published v0.0.1 source predates the E2B adapter.'
          else
            echo 'Missing required installed E2B acceptance suite.' >&2
            exit 1
          fi
      - uses: actions/setup-go@v5
        if: steps.suite.outputs.present == 'true'
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        if: steps.suite.outputs.present == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            sandbox-ts/package-lock.json
            scripts/e2b-compatibility/package-lock.json
      - uses: actions/setup-python@v5
        if: steps.suite.outputs.present == 'true'
        with:
          python-version: '3.15'
      - name: prepare pinned references and SDK build tools
        if: steps.suite.outputs.present == 'true'
        run: |
          mkdir -p artifacts/e2b-setup
          bash scripts/e2b-compatibility/setup.sh 2>&1 | tee artifacts/e2b-setup/references.log
          npm --prefix sandbox-ts ci 2>&1 | tee artifacts/e2b-setup/sdk.log
      - name: verify the comparison gate fails closed
        if: steps.suite.outputs.present == 'true'
        run: python scripts/e2b-compatibility/selfcheck.py | tee artifacts/e2b-setup/selfcheck.log
      - name: build and pin the local compatibility image
        if: steps.suite.outputs.present == 'true'
        run: |
          docker build --progress=plain -t tiny-sandbox-e2b:ci examples/e2b 2>&1 | tee artifacts/e2b-setup/image-build.log
          image=$(docker image inspect tiny-sandbox-e2b:ci --format '{{.Id}}')
          echo "SANDBOX_E2B_IMAGE=$image" >> "$GITHUB_ENV"
      - name: installed Python and TypeScript acceptance plus compare
        if: steps.suite.outputs.present == 'true'
        env:
          BACKGROUND_PROFILE: ${{ steps.suite.outputs.background }}
        run: |
          args=()
          if [ "$BACKGROUND_PROFILE" = true ]; then args+=(--profile background); fi
          bash scripts/e2b-compatibility/installed.sh artifacts/e2b-ci "$SANDBOX_E2B_IMAGE" "${args[@]}"
      - name: deployment policy, recovery, faults and latency baseline
        if: steps.suite.outputs.background == 'true'
        run: |
          mkdir -p artifacts/operations-coverage
          go build -cover -covermode=atomic -coverpkg=./... -o artifacts/e2b-setup/sandboxd ./cmd/sandboxd
          GOCOVERDIR="$PWD/artifacts/operations-coverage" python scripts/e2e-operations.py --server artifacts/e2b-setup/sandboxd \
            --image "$SANDBOX_E2B_IMAGE" --out artifacts/operations
      - uses: actions/upload-artifact@v4
        if: steps.suite.outputs.background == 'true'
        with:
          name: coverage-operations
          path: artifacts/operations-coverage/
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: steps.suite.outputs.background == 'true'
        with:
          name: sdk-distributions
          path: |
            artifacts/e2b-ci/wheels/*.whl
            artifacts/e2b-ci/npm/*.tgz
          if-no-files-found: error
          retention-days: 7
      - name: no containers remain
        if: always() && steps.suite.outputs.present == 'true'
        run: |
          mkdir -p artifacts/e2b-setup
          docker ps -aq --filter 'label=tiny-sandbox.owner' > artifacts/e2b-setup/remaining-containers.txt
          cat artifacts/e2b-setup/remaining-containers.txt
          test ! -s artifacts/e2b-setup/remaining-containers.txt
      - uses: actions/upload-artifact@v4
        if: always() && steps.suite.outputs.present == 'true'
        with:
          name: e2b-compatibility-artifacts
          path: |
            artifacts/e2b-setup/
            artifacts/e2b-ci/
            artifacts/operations/
            !artifacts/operations/state/**
            !artifacts/operations/**/*.sock
            !artifacts/e2b-setup/sandboxd
            !artifacts/e2b-ci/venv/**
            !artifacts/e2b-ci/consumer/**
            !artifacts/e2b-ci/run/sandboxd
            !artifacts/e2b-ci/**/*.sock
          retention-days: 7

  stdin-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - env:
          HISTORICAL_REF: ${{ inputs.ref }}
        run: |
          if test -f scripts/e2e-stdin.sh; then
            bash scripts/e2e-stdin.sh artifacts/stdin-e2e
          elif [ -n "$HISTORICAL_REF" ]; then
            echo 'No stdin E2E suite in this historical revision.'
          else
            echo 'Missing required stdin E2E suite.' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stdin-e2e-artifacts
          path: artifacts/stdin-e2e/
          retention-days: 7

  files-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: detect file E2E at the requested revision
        id: files
        env:
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          if test -f scripts/e2e-files.sh; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          elif test -n "$REQUESTED_REF"; then
            echo 'No file E2E in this historical revision.'
          else
            echo 'Missing required scripts/e2e-files.sh on normal CI.' >&2
            exit 1
          fi
      - uses: actions/setup-go@v5
        if: steps.files.outputs.present == 'true'
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        if: steps.files.outputs.present == 'true'
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        if: steps.files.outputs.present == 'true'
        with:
          python-version: '3.15'
      - name: Three SDKs and CLI file scenarios against real Docker
        if: steps.files.outputs.present == 'true'
        run: bash scripts/e2e-files.sh artifacts/files-e2e
      - uses: actions/upload-artifact@v4
        if: always() && steps.files.outputs.present == 'true'
        with:
          name: files-e2e-artifacts
          path: artifacts/files-e2e/
          retention-days: 7

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: detect TypeScript SDK at the requested revision
        id: sdk
        run: |
          if test -f sandbox-ts/package-lock.json; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'No TypeScript SDK in this historical revision.'
          fi
      - uses: actions/setup-go@v5
        if: steps.sdk.outputs.present == 'true'
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        if: steps.sdk.outputs.present == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sandbox-ts/package-lock.json
      - name: TypeScript package and real Docker contract scenarios
        if: steps.sdk.outputs.present == 'true'
        run: bash scripts/e2e-typescript.sh artifacts/typescript-e2e
      - name: SDK public background and capability regressions
        if: steps.sdk.outputs.present == 'true'
        run: |
          if test -d sandbox-ts/tests; then node --test sandbox-ts/tests/*.test.mjs; fi
      - uses: actions/upload-artifact@v4
        if: always() && steps.sdk.outputs.present == 'true'
        with:
          name: typescript-e2e-artifacts
          path: artifacts/typescript-e2e/
          retention-days: 7

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        if: inputs.ref == '' || hashFiles('scripts/comment-lint/check.py') != ''
        with:
          python-version: '3.12'
      - name: enforce the comment ratchet
        if: inputs.ref == '' || hashFiles('scripts/comment-lint/check.py') != ''
        env:
          COMMENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HISTORICAL_REF: ${{ inputs.ref }}
        run: |
          if [ -n "$HISTORICAL_REF" ]; then COMMENT_BASE=$(git rev-parse HEAD^); fi
          make PYTHON=python comment-lint comment-lint-e2e
      - uses: actions/upload-artifact@v4
        if: hashFiles('artifacts/comment-lint/e2e.json') != ''
        with:
          name: comment-lint-e2e
          path: artifacts/comment-lint/e2e.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
      - name: vet
        run: go vet ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: unit and contract tests (race, coverage)
        run: |
          mkdir -p "$RUNNER_TEMP/cov-unit"
          go test -race -covermode=atomic -coverpkg=./... ./... \
            -args -test.gocoverdir="$RUNNER_TEMP/cov-unit"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          if-no-files-found: error
          path: ${{ runner.temp }}/cov-unit
          retention-days: 3

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build every command and the example
        run: |
          go build ./...
          go build -o /dev/null ./cmd/sandboxd
          go build -o /dev/null ./cmd/sandboxctl
          go build -o /dev/null ./examples/agent-tool/cmd/demo
      - name: check release configuration
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: check
      - name: release snapshot
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --snapshot --clean
      - name: verify checksums and supported platform archives
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          dist = pathlib.Path("dist")
          version = json.loads((dist / "metadata.json").read_text())["version"]
          expected = {
              f"tiny-sandbox_{version}_{system}_{arch}.tar.gz"
              for system in ["linux", "darwin"]
              for arch in ["amd64", "arm64"]
          }
          actual = {p.name for p in dist.glob("*.tar.gz")} | {p.name for p in dist.glob("*.zip")}
          assert actual == expected, (actual, expected)
          checksums = (dist / "checksums.txt").read_text().splitlines()
          assert len(checksums) == len(expected), checksums
          assert {line.split()[1] for line in checksums} == expected, checksums
          PY
          (cd dist && sha256sum -c --quiet checksums.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: release-snapshot
          path: dist/
          retention-days: 3

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
      - name: end-to-end suite with coverage
        env:
          E2E_COVERAGE: "1"
        run: bash scripts/e2e.sh artifacts/e2e
      - name: observability and readiness with real Docker
        run: bash scripts/e2e-observability.sh artifacts/observability-e2e
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-e2e
          path: artifacts/e2e/coverage/
          if-no-files-found: error
          retention-days: 3
      - name: no containers remain
        run: |
          remaining=$(docker ps -aq --filter 'label=tiny-sandbox.owner' | wc -l | tr -d ' ')
          echo "containers remaining: $remaining"
          test "$remaining" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-artifacts
          path: artifacts/
          retention-days: 7

  coverage:
    runs-on: ubuntu-latest
    needs: [test, e2e, e2b-compatibility]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: coverage-unit
          path: artifacts/unit
      - uses: actions/download-artifact@v4
        with:
          name: coverage-e2e
          path: artifacts/e2e
      - uses: actions/download-artifact@v4
        if: hashFiles('scripts/e2e-operations.py') != ''
        with:
          name: coverage-operations
          path: artifacts/operations
      - name: merge coverage and enforce the gate
        run: |
          e2e=artifacts/e2e
          if test -f scripts/e2e-operations.py; then
            mkdir -p artifacts/combined
            go tool covdata merge -i=artifacts/e2e,artifacts/operations -o=artifacts/combined
            e2e=artifacts/combined
          fi
          bash scripts/coverage.sh artifacts/unit "$e2e" 70

  python-sdk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.15']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: build Python distribution
        run: |
          python -m pip install build
          python -m build --outdir artifacts/python-dist sandbox-python
          python -m pip install --force-reinstall artifacts/python-dist/*.whl
      - name: Python end-to-end contract and entry gate
        env:
          PYTHON: python
          SDK_INSTALLED: '1'
        run: bash scripts/e2e-python.sh artifacts/python-e2e
      - name: installed SDK public background and capability regressions
        run: |
          if test -d sandbox-python/tests; then python -B -m unittest discover -s sandbox-python/tests -v; fi
      - name: no containers remain
        if: always()
        run: |
          remaining=$(docker ps -aq --filter 'label=tiny-sandbox.owner' | wc -l | tr -d ' ')
          echo "containers remaining: $remaining"
          test "$remaining" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-sdk-${{ matrix.python-version }}
          path: |
            artifacts/python-e2e/
            artifacts/python-dist/
          retention-days: 7
