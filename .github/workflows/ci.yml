name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Exact source revision to validate
        type: string
        default: ''

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: detect TypeScript SDK at the requested revision
        id: sdk
        run: |
          if test -f sandbox-ts/package-lock.json; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'No TypeScript SDK in this historical revision.'
          fi
      - uses: actions/setup-go@v5
        if: steps.sdk.outputs.present == 'true'
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        if: steps.sdk.outputs.present == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sandbox-ts/package-lock.json
      - name: TypeScript package and real Docker contract scenarios
        if: steps.sdk.outputs.present == 'true'
        run: bash scripts/e2e-typescript.sh artifacts/typescript-e2e
      - uses: actions/upload-artifact@v4
        if: always() && steps.sdk.outputs.present == 'true'
        with:
          name: typescript-e2e-artifacts
          path: artifacts/typescript-e2e/
          retention-days: 7

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
      - name: vet
        run: go vet ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: unit and contract tests (race, coverage)
        run: |
          mkdir -p "$RUNNER_TEMP/cov-unit"
          go test -race -covermode=atomic -coverpkg=./... ./... \
            -args -test.gocoverdir="$RUNNER_TEMP/cov-unit"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: ${{ runner.temp }}/cov-unit
          retention-days: 3

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build every command and the example
        run: |
          go build ./...
          go build -o /dev/null ./cmd/sandboxd
          go build -o /dev/null ./cmd/sandboxctl
          go build -o /dev/null ./examples/agent-tool/cmd/demo
      - name: check release configuration
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: check
      - name: release snapshot
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --snapshot --clean
      - name: verify checksums and supported platform archives
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          dist = pathlib.Path("dist")
          version = json.loads((dist / "metadata.json").read_text())["version"]
          expected = {
              f"tiny-sandbox_{version}_{system}_{arch}.tar.gz"
              for system in ["linux", "darwin"]
              for arch in ["amd64", "arm64"]
          }
          actual = {p.name for p in dist.glob("*.tar.gz")} | {p.name for p in dist.glob("*.zip")}
          assert actual == expected, (actual, expected)
          checksums = (dist / "checksums.txt").read_text().splitlines()
          assert len(checksums) == len(expected), checksums
          assert {line.split()[1] for line in checksums} == expected, checksums
          PY
          (cd dist && sha256sum -c --quiet checksums.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: release-snapshot
          path: dist/
          retention-days: 3

  e2e:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: end-to-end suite with coverage
        env:
          E2E_COVERAGE: "1"
        run: bash scripts/e2e.sh artifacts/e2e
      - name: merge coverage and enforce the gate
        run: |
          mkdir -p "$RUNNER_TEMP/cov-unit"
          go test -race -covermode=atomic -coverpkg=./... ./... \
            -args -test.gocoverdir="$RUNNER_TEMP/cov-unit"
          bash scripts/coverage.sh "$RUNNER_TEMP/cov-unit" artifacts/e2e/coverage 70
      - name: no containers remain
        run: |
          remaining=$(docker ps -aq --filter 'label=tiny-sandbox.owner' | wc -l | tr -d ' ')
          echo "containers remaining: $remaining"
          test "$remaining" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-artifacts
          path: artifacts/
          retention-days: 7

  python-sdk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.15']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: build Python distribution
        run: |
          python -m pip install build
          python -m build --outdir artifacts/python-dist sandbox-python
          python -m pip install --force-reinstall artifacts/python-dist/*.whl
      - name: Python end-to-end contract and entry gate
        env:
          PYTHON: python
          SDK_INSTALLED: '1'
        run: bash scripts/e2e-python.sh artifacts/python-e2e
      - name: no containers remain
        if: always()
        run: |
          remaining=$(docker ps -aq --filter 'label=tiny-sandbox.owner' | wc -l | tr -d ' ')
          echo "containers remaining: $remaining"
          test "$remaining" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-sdk-${{ matrix.python-version }}
          path: |
            artifacts/python-e2e/
            artifacts/python-dist/
          retention-days: 7
