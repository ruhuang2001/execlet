openapi: 3.1.0
info:
  title: tiny-sandbox
  version: 0.0.1
  summary: Code-execution sandbox for AI agents
  description: |
    Normative HTTP contract for the tiny-sandbox reference server.
    docs/api.md is the prose source of this contract; when the two disagree,
    fix one of them in the same change.
    Every handled response includes X-Request-ID. A single incoming value with
    1-128 ASCII letters, digits, dots, underscores, or hyphens is preserved;
    otherwise the server generates a UUID. Access logs use route templates and
    never record query values, request bodies, or authorization headers.
servers:
  - url: http://localhost:8080
    description: Default base URL; override with SANDBOX_DOMAIN.
security:
  - bearerAuth: []
tags:
  - name: health
  - name: sandboxes
  - name: executions
  - name: files
paths:
  /healthz:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness probe and build version
      description: >-
        Reports whether the server is up and which version it runs. This is the
        liveness endpoint never requires authentication.
      security: []
      responses:
        '200':
          description: The server is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /readyz:
    get:
      tags: [health]
      operationId: getReadiness
      summary: Docker runtime readiness
      description: >-
        Public probe of Docker's unversioned /_ping, bounded to two seconds.
        Requires HTTP 200 and body OK; no runtime details are exposed on failure.
      security: []
      responses:
        '200':
          description: Docker is ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: Docker is unreachable or did not answer a valid probe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
  /v1/sandboxes:
    post:
      tags: [sandboxes]
      operationId: createSandbox
      summary: Create a sandbox
      description: >-
        Treated as a creation request for a sandbox. Creation is synchronous:
        the response is sent once the container is running, so pending is only
        observable by concurrent readers. Not idempotent; clients must not
        retry it automatically. All request fields are optional and unknown
        fields are ignored.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSandboxRequest'
      responses:
        '201':
          description: The sandbox is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sandbox'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '502':
          $ref: '#/components/responses/BackendError'
        '503':
          $ref: '#/components/responses/Unavailable'
    get:
      tags: [sandboxes]
      operationId: listSandboxes
      summary: List sandboxes
      description: >-
        Newest first. Killed sandboxes are included until the server restarts.
      responses:
        '200':
          description: Every sandbox the server knows about.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/sandboxes/{sandbox_id}:
    parameters:
      - $ref: '#/components/parameters/SandboxID'
    get:
      tags: [sandboxes]
      operationId: getSandbox
      summary: Get one sandbox
      description: Read requests never change state.
      responses:
        '200':
          description: The sandbox.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sandbox'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      tags: [sandboxes]
      operationId: deleteSandbox
      summary: Kill a sandbox
      description: >-
        Marks the sandbox killed and records canceled intent for a running
        execution. Container removal is best effort and failures are not returned.
        Deleting a killed sandbox returns it unchanged without retrying removal.
      responses:
        '200':
          description: The sandbox, in state killed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sandbox'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '502':
          $ref: '#/components/responses/BackendError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/sandboxes/{sandbox_id}/pause:
    parameters:
      - $ref: '#/components/parameters/SandboxID'
    post:
      tags: [sandboxes]
      operationId: pauseSandbox
      summary: Pause a sandbox
      description: >-
        Freezes every process in the sandbox, including a running execution.
        Idempotent: pausing a paused sandbox returns it unchanged. Not allowed
        while pending or killed.
      responses:
        '200':
          description: The sandbox, in state paused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sandbox'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '502':
          $ref: '#/components/responses/BackendError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/sandboxes/{sandbox_id}/resume:
    parameters:
      - $ref: '#/components/parameters/SandboxID'
    post:
      tags: [sandboxes]
      operationId: resumeSandbox
      summary: Resume a sandbox
      description: >-
        Idempotent: resuming a running sandbox returns it unchanged. Not
        allowed while pending or killed.
      responses:
        '200':
          description: The sandbox, in state running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sandbox'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '502':
          $ref: '#/components/responses/BackendError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/sandboxes/{sandbox_id}/executions:
    parameters:
      - $ref: '#/components/parameters/SandboxID'
    post:
      tags: [executions]
      operationId: startExecution
      summary: Start an execution
      description: >-
        Runs argv without a shell. The configured execution slot limit defaults
        to one and accepts up to eight; a start at capacity returns 409 busy.
        Above one slot, unexplained exit 137 is unknown because container-wide
        OOM counters cannot attribute one process. Starting in a paused
        sandbox resumes it first. Reusing an idempotency key with the same
        command returns the retained execution instead of starting it again;
        the same command without a retained key starts a new execution.
        Reusing a key with a different command, cwd, env, or stdin returns 409
        idempotency_conflict.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteRequest'
      responses:
        '201':
          description: A new execution, in state running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Execution'
        '200':
          description: The existing execution for a reused idempotency key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Execution'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '502':
          $ref: '#/components/responses/BackendError'
        '503':
          $ref: '#/components/responses/Unavailable'
    get:
      tags: [executions]
      operationId: listExecutions
      summary: List executions
      description: Newest first, without stdout and stderr.
      responses:
        '200':
          description: Every execution of the sandbox.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/sandboxes/{sandbox_id}/executions/{execution_id}:
    parameters:
      - $ref: '#/components/parameters/SandboxID'
      - $ref: '#/components/parameters/ExecutionID'
    get:
      tags: [executions]
      operationId: getExecution
      summary: Get one execution
      description: Includes the retained stdout and stderr.
      responses:
        '200':
          description: The execution.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Execution'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/sandboxes/{sandbox_id}/executions/{execution_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/SandboxID'
      - $ref: '#/components/parameters/ExecutionID'
    post:
      tags: [executions]
      operationId: cancelExecution
      summary: Cancel an execution
      description: >-
        Records canceled intent and signals the process group with SIGTERM.
        Waits up to 2 seconds before SIGKILL, then up to 8 more seconds before
        best-effort container removal. Backend calls add time and request
        cancellation can shorten these waits. Removal marks the sandbox killed
        with kill_reason requested. After removal, waits up to 2 more seconds
        and returns the latest snapshot, which may remain nonterminal.
        Canceling an already completed execution returns it unchanged.
      responses:
        '200':
          description: The latest execution snapshot; inspect state to confirm completion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Execution'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '502':
          $ref: '#/components/responses/BackendError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/sandboxes/{sandbox_id}/executions/{execution_id}/events:
    parameters:
      - $ref: '#/components/parameters/SandboxID'
      - $ref: '#/components/parameters/ExecutionID'
      - $ref: '#/components/parameters/LastEventID'
    get:
      tags: [executions]
      operationId: streamExecutionEvents
      summary: Stream execution events
      description: >-
        Server-sent events. Event IDs are decimal integers starting at 1 and
        increasing by 1 per event within an execution. Types are stdout and
        stderr carrying data of at most 32 KiB per chunk, truncated carrying
        limit_bytes and sent at most once, and complete carrying the full
        Execution and always sent last. Output is text: chunks are cut on UTF-8
        boundaries so a valid multi-byte character is never split across two
        events, and bytes that are not valid UTF-8 are replaced with U+FFFD in
        each stream independently. Last-Event-ID replays only events with a
        greater ID, then continues live; a non-integer value or one beyond the
        newest event is 400 invalid_request. The server sends a ping comment
        every 15 seconds while open and closes the stream after complete.
        Closing a stream never affects the execution, and an open stream counts
        as activity for the idle timeout. A sandbox retains its 200 most recent
        executions; older completed ones are dropped together with their
        idempotency keys.
      responses:
        '200':
          description: An event stream.
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                id: 1
                event: stdout
                data: {"data":"hello\n"}

                id: 2
                event: complete
                data: {"id":"exe_456","state":"completed","exit_code":0,"termination_reason":"exited"}

        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/sandboxes/{sandbox_id}/files:
    parameters:
      - $ref: '#/components/parameters/SandboxID'
      - $ref: '#/components/parameters/FilePath'
    get:
      tags: [files]
      operationId: readFile
      summary: Read a file
      description: >-
        Returns the raw bytes. The sandbox resumes first if it is paused. A
        path that is not absolute is an invalid request. Files larger than
        10 MiB are rejected by Docker archive extraction with 502 backend_error.
      responses:
        '200':
          description: The file contents.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/BackendError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
    put:
      tags: [files]
      operationId: writeFile
      summary: Write a file
      description: >-
        Writes raw bytes, creating parent directories and replacing an existing
        file. The sandbox resumes first if it is paused. Idempotent.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '204':
          description: The file was written.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '502':
          $ref: '#/components/responses/BackendError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/sandboxes/{sandbox_id}/files/list:
    parameters:
      - $ref: '#/components/parameters/SandboxID'
      - $ref: '#/components/parameters/FilePath'
    get:
      tags: [files]
      operationId: listFiles
      summary: List immediate directory children in bytewise name order
      description: >-
        Resumes paused sandboxes. No snapshot consistency across pages. Paths
        must be UTF-8, absolute, at most 4096 bytes, without NUL or parent traversal.
        Docker recursively scans at most 64 MiB and 10000 archive entries per
        page within 30 seconds; large nested content can cause 413 even for a
        small page. Child symlinks are not followed. Duplicate query values fail.
      parameters:
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 1000, default: 100}
        - in: query
          name: cursor
          schema: {type: string, maxLength: 12000}
          description: Opaque next_cursor from the preceding page for this path.
      responses:
        '200':
          description: One directory page; next_cursor is omitted on the last page.
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  next_cursor: {type: string}
                  entries:
                    type: array
                    items:
                      type: object
                      required: [name, size, mode, mtime, is_dir]
                      properties:
                        name: {type: string}
                        size: {type: integer, format: int64, description: Regular-file bytes or symlink target-path bytes; zero for directories}
                        mode: {type: integer, description: POSIX permission bits}
                        mtime: {type: string, format: date-time}
                        is_dir: {type: boolean}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '502':
          $ref: '#/components/responses/BackendError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/sandboxes/{sandbox_id}/files/archive:
    parameters:
      - $ref: '#/components/parameters/SandboxID'
      - $ref: '#/components/parameters/FilePath'
    get:
      tags: [files]
      operationId: readArchive
      summary: Download a validated tar archive rooted at the selected name
      description: >-
        Buffers and validates at most 32 MiB encoded, 16 MiB regular payload,
        and 4096 entries. Preserves regular bytes, directories, safe internal
        relative symlinks without parent traversal components (even normalized-safe
        parent traversal is rejected) and earlier-member hardlinks. Root entry is the
        selected basename. Unsupported selected content intentionally returns 400,
        including a symlink selected without its target member; limits return 413.
      responses:
        '200':
          description: Validated uncompressed tar bytes.
          content:
            application/x-tar:
              schema: {type: string, format: binary}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '502':
          $ref: '#/components/responses/BackendError'
    put:
      tags: [files]
      operationId: writeArchive
      summary: Extract a fully validated tar beneath an existing directory
      description: >-
        Validates all entries before any mutation. Rejects absolute/traversal
        names or targets, devices, FIFO, sparse, unsupported metadata, duplicate
        names, nondirectory ancestors, and existing symlink destinations. Limits:
        32 MiB encoded, 16 MiB regular bytes, 4096 members, 4096-byte names, 1 MiB aggregate member/link path text.
        Extraction is not atomic against runtime failure or concurrent writes.
        Upload is not automatically retried by SDKs. No host extraction occurs.
      requestBody:
        required: true
        content:
          application/x-tar:
            schema: {type: string, format: binary}
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        '204':
          description: Archive extracted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '502':
          $ref: '#/components/responses/BackendError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        Required on every /v1 request when the server runs with
        SANDBOX_API_KEY set. The key is compared in constant time. /healthz and /readyz
        never requires it.
  parameters:
    SandboxID:
      name: sandbox_id
      in: path
      required: true
      description: Opaque sandbox identifier. Clients must not parse it.
      schema:
        type: string
    ExecutionID:
      name: execution_id
      in: path
      required: true
      description: Opaque execution identifier. Clients must not parse it.
      schema:
        type: string
    FilePath:
      name: path
      in: query
      required: true
      description: Absolute path inside the sandbox.
      schema:
        type: string
    LastEventID:
      name: Last-Event-ID
      in: header
      required: false
      description: >-
        Replays only events whose ID is greater than this value, then continues
        live. A non-integer value is 400 invalid_request.
      schema:
        type: string
  responses:
    BadRequest:
      description: >-
        400 invalid_request: malformed JSON, an invalid value, or an invalid
        Last-Event-ID.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: invalid_request
            message: command must not be empty
    Unauthorized:
      description: '401 unauthorized: the API key is missing or wrong.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: unauthorized
            message: missing or invalid API key
    NotFound:
      description: '404 not_found: the sandbox, execution, or file does not exist.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: not_found
            message: sandbox sbx_123 does not exist
    Conflict:
      description: >-
        409, one of invalid_state (the operation is not allowed in the
        sandbox's current state), busy (the sandbox's execution slots are full), or idempotency_conflict (the key was reused with a
        different command, cwd, env, or stdin).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid_state:
              value:
                code: invalid_state
                message: sandbox sbx_123 is killed
            busy:
              value:
                code: busy
                message: sandbox sbx_123 is already running execution exe_456
            idempotency_conflict:
              value:
                code: idempotency_conflict
                message: idempotency key was used for a different command, cwd, environment, or stdin
    PayloadTooLarge:
      description: >-
        413 payload_too_large: the JSON request body exceeds 1 MiB (8 MiB for execution starts), decoded stdin exceeds 1 MiB, or a file
        upload exceeds 10 MiB, a directory archive scan exceeds 64 MiB / 10000 headers,
        or tar transfer exceeds 32 MiB encoded / 16 MiB payload / 4096 members.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: payload_too_large
            message: request body exceeds 1048576 bytes
    RateLimited:
      description: >-
        429 rate_limited: the create would exceed the server's live-sandbox
        limit. Retryable after deleting a sandbox.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Internal:
      description: '500 internal: an unexpected server error. Retryable.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BackendError:
      description: '502 backend_error: the container runtime failed. Retryable.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: >-
        503 unavailable: the server is shutting down or not ready. Retryable.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Readiness:
      type: object
      required: [status, version, docker]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        version:
          type: string
        docker:
          type: string
          enum: [ok, unreachable]
    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          description: The build version.
    CreateSandboxRequest:
      type: object
      description: >-
        Every field is optional. Unknown fields are ignored so a newer client
        can talk to an older server.
      properties:
        image:
          type: string
          default: alpine:3.20
        memory_mb:
          type: integer
          minimum: 16
          default: 512
        max_concurrent_executions:
          type: integer
          minimum: 1
          maximum: 8
          default: 1
          description: Immutable execution slot limit. Above one, unexplained exit 137 is unknown because container OOM counters cannot identify one process.
        pids_limit:
          type: integer
          minimum: 64
          default: 1024
          description: >-
            Bounds tasks, not processes; threads count. Stops a fork bomb at
            the container boundary instead of at the host's PID table.
        nano_cpus:
          type: integer
          minimum: 0
          default: 0
          description: >-
            CPU limit in units of 1e-9 CPUs; 1000000000 is one CPU. 0 means no
            limit.
        network:
          type: string
          enum: [bridge, none]
          default: bridge
          description: >-
            bridge gives the sandbox outbound network access; none removes
            networking entirely. Host networking is not offered.
        timeout_seconds:
          type: integer
          minimum: 0
          default: 300
          description: Lifetime timeout; 0 disables it.
        timeout_action:
          type: string
          enum: [kill, pause]
          default: kill
        idle_timeout_seconds:
          type: integer
          minimum: 0
          default: 0
          description: Idle timeout; 0 disables it.
        idle_timeout_action:
          type: string
          enum: [kill, pause]
          default: kill
    Sandbox:
      type: object
      required:
        - id
        - state
        - image
        - memory_mb
        - max_concurrent_executions
        - pids_limit
        - nano_cpus
        - network
        - timeout_seconds
        - timeout_action
        - idle_timeout_seconds
        - idle_timeout_action
        - created_at
        - expires_at
        - kill_reason
      properties:
        id:
          type: string
          description: Opaque identifier. Clients must not parse it.
        state:
          type: string
          enum: [pending, running, paused, killed]
        image:
          type: string
        memory_mb:
          type: integer
          minimum: 16
        max_concurrent_executions:
          type: integer
          minimum: 1
          maximum: 8
          default: 1
          description: Immutable execution slot limit. Above one, unexplained exit 137 is unknown because container OOM counters cannot identify one process.
        pids_limit:
          type: integer
          minimum: 64
        nano_cpus:
          type: integer
          minimum: 0
        network:
          type: string
          enum: [bridge, none]
        timeout_seconds:
          type: integer
          minimum: 0
        timeout_action:
          type: string
          enum: [kill, pause]
        idle_timeout_seconds:
          type: integer
          minimum: 0
        idle_timeout_action:
          type: string
          enum: [kill, pause]
        created_at:
          type: string
          format: date-time
          description: RFC 3339 in UTC.
        expires_at:
          type: [string, 'null']
          format: date-time
          description: >-
            The current lifetime deadline. Null when the lifetime timeout is
            disabled, pending, killed, or paused with timeout_action pause.
        kill_reason:
          type: [string, 'null']
          enum: [requested, timeout, idle_timeout, evicted, null]
          description: Set when the sandbox is killed.
    SandboxList:
      type: object
      required: [sandboxes]
      properties:
        sandboxes:
          type: array
          items:
            $ref: '#/components/schemas/Sandbox'
    ExecuteRequest:
      type: object
      required: [command]
      properties:
        command:
          type: array
          minItems: 1
          items:
            type: string
          description: >-
            argv, executed without a shell. Total UTF-8 bytes plus one byte
            per argument must not exceed 1048576; larger commands return 413
            payload_too_large so echoed commands fit complete-event limits.
        idempotency_key:
          type: string
          maxLength: 128
          description: >-
            Optional. Scoped to the sandbox. Reusing a key with the same
            command, cwd, env, and stdin returns the existing execution; reusing it
            with any of these different is 409 idempotency_conflict.
            Changing timeout_seconds on a replay does not change the existing
            execution's deadline.
        timeout_seconds:
          type: integer
          minimum: 0
          description: >-
            Optional. Bounds this execution, in seconds. Omitted or 0 means the
            execution has no deadline of its own. The sandbox lifetime deadline
            still applies. An execution deadline ends the command with
            termination_reason timeout and normally leaves the sandbox running;
            failure to confirm process termination can require container removal.
            A sandbox lifetime deadline with timeout_action kill removes the
            sandbox; timeout_action pause pauses it instead.
        env:
          type: object
          maxProperties: 64
          x-max-key-bytes: 64
          x-max-total-bytes: 32768
          additionalProperties:
            type: string
            x-max-bytes: 8192
          description: >-
            Optional. Environment variables for this execution only. A name
            here overrides a variable of the same name that the container
            already has, and every other container variable stays visible.
            Values are never echoed. Execution records retain only the entry count
            and a process-keyed HMAC-SHA256 fingerprint, not raw env.
            Omitted or empty leaves the container's environment unchanged.
            At most 64 entries, 64 bytes per name, 8192 bytes per value, and
            32768 bytes in total; exceeding a bound is an invalid_request.
            A name must be non-empty and must not contain "=", a NUL byte, or a
            newline. A value must not contain a NUL byte.
        cwd:
          type: string
          x-max-bytes: 4096
          description: >-
            Optional. Absolute directory the command runs in, at most 4096
            bytes. Omitted or empty uses the image's working directory. A
            missing or non-directory path does not fail the start: the
            execution completes with exit code 126 and
            "sandbox: cwd is not a usable directory: <path>" on stderr, so a
            bad path is distinguishable from a missing command (127). A
            relative path is an invalid_request.
        stdin:
          type: string
          x-max-bytes: 1048576
          description: >-
            One-shot UTF-8 text followed by EOF. Omitted or empty means EOF.
            The decoded input is at most 1 MiB; larger input is 413
            payload_too_large. Input is not interactive and is never echoed
            in execution responses. Only an input fingerprint is retained
            for idempotency comparison. A command may itself print its input.
            JSON bodies are separately bounded at 8 MiB for escaped text.
            Non-empty input requires writable /tmp and /bin/mkdir, /bin/rm,
            /bin/rmdir in the image; missing staging tools return backend_error.
    ExecutionSummary:
      type: object
      required:
        - id
        - sandbox_id
        - command
        - state
        - exit_code
        - termination_reason
        - output_truncated
        - started_at
        - finished_at
      properties:
        id:
          type: string
          description: Opaque identifier. Clients must not parse it.
        sandbox_id:
          type: string
        command:
          type: array
          minItems: 1
          items:
            type: string
        cwd:
          type: [string, 'null']
          description: >-
            The working directory this execution was started with, echoed for
            diagnostics. Null when the request set none. The environment is
            never echoed, because it may carry credentials.
        state:
          type: string
          enum: [running, completed]
        exit_code:
          type: [integer, 'null']
          description: >-
            Null while running, or when the runtime could not report one.
        termination_reason:
          type: [string, 'null']
          enum: [canceled, timeout, oom, evicted, exited, unknown, null]
          description: >-
            Null while running. The classifier uses the first recorded intent
            (canceled or timeout), then OOM evidence, container liveness, and exit
            status. The eviction sweep can also finalize an execution directly
            as evicted, preserving a previously recorded intent. Above one configured
            execution slot, OOM counters are not attributed to an execution and
            an otherwise unexplained exit 137 is unknown. Exit code 137 alone
            never implies oom.
        output_truncated:
          type: boolean
          description: >-
            True when output exceeded the retention limit of 1 MiB or 4096
            events.
        started_at:
          type: string
          format: date-time
        finished_at:
          type: [string, 'null']
          format: date-time
    Execution:
      allOf:
        - $ref: '#/components/schemas/ExecutionSummary'
        - type: object
          required: [stdout, stderr]
          description: >-
            Retained output. It is exactly the data delivered in events, so a
            replay from ID 0 reproduces stdout and stderr.
          properties:
            stdout:
              type: string
            stderr:
              type: string
    ExecutionList:
      type: object
      required: [executions]
      properties:
        executions:
          type: array
          description: Newest first, without stdout and stderr.
          items:
            $ref: '#/components/schemas/ExecutionSummary'
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - invalid_request
            - unauthorized
            - not_found
            - invalid_state
            - busy
            - idempotency_conflict
            - payload_too_large
            - rate_limited
            - internal
            - backend_error
            - unavailable
        message:
          type: string
